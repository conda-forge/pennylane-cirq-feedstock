{% set name = "pennylane-cirq" %}
{% set version = "0.44.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/PennyLaneAI/pennylane-cirq/archive/v{{ version }}.tar.gz
  sha256: 5a2a3999450ef5faf09d5b451987741268cd7b85633489b68e51710f349bf351

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - cirq-core >=0.10
    - cirq-pasqal >=0.10
    - pennylane >=0.43.0
    - python >={{ python_min }}

test:
  imports:
    - pennylane_cirq
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: http://xanadu.ai
  summary: PennyLane plugin for Cirq
  description: |
    The PennyLane-Cirq plugin integrates Google's Cirq software library
    with PennyLane's quantum machine learning capabilities.
  license: Apache-2.0
  license_file: LICENSE
  dev_url: https://github.com/PennyLaneAI/pennylane-cirq
  doc_url: https://pennylane-cirq.readthedocs.io/

extra:
  recipe-maintainers:
    - BastianZim
